<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Información de firma electrónica</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #fff; }
    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 16px;
      color: #555;
      font-family: Arial, Helvetica, sans-serif;
    }
    .signature-info {
      width: min(100%, 560px);
      padding: 0;
      line-height: 1.12;
    }
    .validation {
      margin: 0 0 9px;
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(14px, 3.4vw, 17px);
      font-weight: 700;
      color: #000;
    }
    .signed-by {
      margin: 0 0 3px;
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(13px, 3.2vw, 16px);
      font-weight: 700;
      color: #000;
    }
    .name {
      margin: 0;
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(20px, 5vw, 27px);
      line-height: 1.03;
      font-weight: 900;
      letter-spacing: .2px;
      text-transform: uppercase;
      color: #111;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main class="signature-info" aria-label="Información de firma electrónica">
    <p class="validation">Validar únicamente en FirmaEC.</p>
    <p class="signed-by">Firmado electrónicamente por:</p>
    <h1 class="name">ALEXIS WLADIMIR<br>RODRIGUEZ PADILLA</h1>
  </main>
</body>
</html>
